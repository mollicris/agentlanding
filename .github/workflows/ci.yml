name: CI / Deploy to Cloud Run

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_REGION: southamerica-west1
  CLOUD_RUN_SERVICE: landingagent
  AR_REPO: cloud-run-source-deploy
  IMAGE_NAME: landingagent

jobs:
  # ---------- Verificación (lint + typecheck + build con Node) ----------
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ---------- Build imagen + Deploy a Cloud Run ----------
  deploy:
    name: Build & Deploy to Cloud Run
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image path
        id: img
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build Docker image with VITE_* baked in
        run: |
          docker build \
            --progress=plain \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg VITE_DASHBOARD_URL="${{ secrets.VITE_DASHBOARD_URL }}" \
            --tag ${{ steps.img.outputs.image }}:${{ github.sha }} \
            --tag ${{ steps.img.outputs.image }}:latest \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ steps.img.outputs.image }}:${{ github.sha }}
          docker push ${{ steps.img.outputs.image }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ steps.img.outputs.image }}:${{ github.sha }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Deployed to: $URL"
          echo "### Deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Service: \`${{ env.CLOUD_RUN_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.img.outputs.image }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: $URL" >> $GITHUB_STEP_SUMMARY
