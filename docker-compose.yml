services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Variables VITE_* se inyectan en build-time (no runtime)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-http://localhost:5173}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    image: landing:latest
    container_name: landing-app
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
